services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"   # local access for tests; not exposed to the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      KALSHI_API_BASE: ${KALSHI_API_BASE}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE:
      LANGSMITH_TRACING:
      LANGSMITH_API_KEY:
      OPENAI_API_KEY:
      PLANNER_MODEL:
      RESEARCHER_MODEL:
      RESEARCH_REASONING_EFFORT:
      MAX_RESEARCHERS:
      MAX_SEARCHES_PER_RESEARCHER:
      RESEARCHER_MAX_OUTPUT_TOKENS:
      MAX_CONCURRENT_RUNS:
      RUN_COST_WARN_USD:
      SPORTS_SERIES:
      GAMES_CACHE_SECONDS:
      SPORTS_FETCH_CONCURRENCY:
      SPORTS_DISCOVERY:
      SPORTS_EXCLUDE_TAGS:
      MEASURED_MIN_GAMES:
      FETCH_ENABLED:
      FETCH_MAX_PAGES_PER_RUN:
      FETCH_CONCURRENCY:
      FETCH_TIMEOUT_SECONDS:
      FETCH_MAX_BYTES:
      CHECK_ENABLED:
      CHECKER_MODEL:
      CHECKER_REASONING_EFFORT:
      CHECK_PAGE_CHARS:
      CHECKER_MAX_OUTPUT_TOKENS:
      CHECK_CONCURRENCY:
      FORECASTER_MODEL:
      FORECASTER_REASONING_EFFORT:
      FORECASTER_MAX_OUTPUT_TOKENS:
      FORECASTER_COUNT:
      EDGE_MIN:
      MIN_SUPPORTED_CLAIMS:
      MIN_ASK_SIZE:
      MIN_RESEARCH_SHIFT:
      EDGE_PLAUSIBLE_MAX:
      OPPORTUNITY_MAX_AGE_HOURS:
      MONITOR_ENABLED:
      ALERTS_ENABLED:
      TELEGRAM_BOT_TOKEN:
      TELEGRAM_CHAT_ID:
      MONITOR_INTERVAL_MINUTES:
      ALERT_MOVE_CENTS:
      ALERT_START_SOON_MINUTES:
      ALERT_COOLDOWN_MINUTES:
      ALERT_FORECAST_CHANGE_POINTS:
      ALERT_UPDATE_DUE_MINUTES:
      AUTO_UPDATE_MAX_PER_DAY:
      ALERT_MAX_PER_HOUR:
      AUTO_RESEARCH_MAX_PER_DAY:
      AUTO_RESEARCH_HOURS_AHEAD:
      AUTO_RESEARCH_MIN_GAP_HOURS:
      ORDER_MAX_CONTRACTS:
      ORDER_MAX_COST_USD:
      ORDER_MAX_DAY_COST_USD:
      ORDER_EXPIRY_MINUTES:
      ORDER_MAX_SLIPPAGE_CENTS:
      TICKET_MAX_LEGS:
      ODDS_ENABLED:
      ODDS_API_KEY:
      ODDS_REGIONS:
      ODDS_CACHE_MINUTES:
      RECORD_BASELINE:
      RESOLVE_AFTER_HOURS:
      RESEARCH_MAX_PER_DAY:
      RESEARCH_UPDATES_MAX_PER_DAY:
      SCREEN_HOURS_AHEAD:
      SCREEN_MIN_CREDITS_LEFT:
      SCREEN_MAX_LEAGUES:
      ORDER_PAUSE_DAY_LOSS_USD:
      ORDER_PAUSE_TOTAL_LOSS_USD:
      ORDER_LOSS_SINCE:
      ORDER_MAX_GAME_COST_USD:
      ORDER_MAX_OPEN_COST_USD:
      LOGIN_MAX_ATTEMPTS:
      LOGIN_LOCKOUT_MINUTES:
      SESSION_TTL_HOURS:
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
