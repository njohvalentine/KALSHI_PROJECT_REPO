services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"   # local access for tests; not exposed to the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      KALSHI_API_BASE: ${KALSHI_API_BASE}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-gpt-5.4-mini}
      RESEARCHER_MODEL: ${RESEARCHER_MODEL:-gpt-5.4}
      RESEARCH_REASONING_EFFORT: ${RESEARCH_REASONING_EFFORT:-low}
      MAX_RESEARCHERS: ${MAX_RESEARCHERS:-4}
      MAX_SEARCHES_PER_RESEARCHER: ${MAX_SEARCHES_PER_RESEARCHER:-3}
      RESEARCHER_MAX_OUTPUT_TOKENS: ${RESEARCHER_MAX_OUTPUT_TOKENS:-4000}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      RUN_COST_WARN_USD: ${RUN_COST_WARN_USD:-3.00}
      SPORTS_SERIES: ${SPORTS_SERIES:-}
      GAMES_CACHE_SECONDS: ${GAMES_CACHE_SECONDS:-60}
      SPORTS_FETCH_CONCURRENCY: ${SPORTS_FETCH_CONCURRENCY:-6}
      FETCH_ENABLED: ${FETCH_ENABLED:-true}
      FETCH_MAX_PAGES_PER_RUN: ${FETCH_MAX_PAGES_PER_RUN:-25}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-5}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-10}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-2000000}
      CHECK_ENABLED: ${CHECK_ENABLED:-true}
      CHECKER_MODEL: ${CHECKER_MODEL:-gpt-5.4-mini}
      CHECKER_REASONING_EFFORT: ${CHECKER_REASONING_EFFORT:-medium}
      CHECK_PAGE_CHARS: ${CHECK_PAGE_CHARS:-30000}
      CHECKER_MAX_OUTPUT_TOKENS: ${CHECKER_MAX_OUTPUT_TOKENS:-4000}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-5}
      FORECASTER_MODEL: ${FORECASTER_MODEL:-gpt-5.4}
      FORECASTER_REASONING_EFFORT: ${FORECASTER_REASONING_EFFORT:-medium}
      FORECASTER_MAX_OUTPUT_TOKENS: ${FORECASTER_MAX_OUTPUT_TOKENS:-4000}
      FORECASTER_COUNT: ${FORECASTER_COUNT:-3}
      EDGE_MIN: ${EDGE_MIN:-0.05}
      MIN_SUPPORTED_CLAIMS: ${MIN_SUPPORTED_CLAIMS:-5}
      MIN_ASK_SIZE: ${MIN_ASK_SIZE:-10}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
